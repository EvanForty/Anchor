<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ANCHOR: the launchpad of stock-backed coins on Solana. Every coin needs an anchor.">
<meta name="theme-color" content="#030817">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>ANCHOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: harbor-at-night app shell — sticky header, routed views in one column, floating dock. Navy from the mark, brass for reserves, sea-blue for actions. */
:root{
  color-scheme:dark;
  --ink:#030817;      /* page ground */
  --hull:#081533;     /* panels */
  --deck:#0e2150;     /* raised controls */
  --line:#1a3168;
  --navy:#012a6e;     /* logo navy */
  --fg:#eef2fb;
  --muted:#8e9dc4;
  --faint:#5a6b96;
  --brass:#dcae5a;    /* reserve / backing */
  --brass-dim:rgba(220,174,90,.16);
  --sea:#4fa8ff;      /* actions */
  --sea-dim:rgba(79,168,255,.16);
  --good:#4fd1a1;
  --bad:#ff6b7a;
  --warn:#ffd65a;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{color:var(--fg);font:15px/1.5 var(--body);
  background:radial-gradient(900px 520px at 50% -120px,rgba(1,42,110,.75),transparent 70%),var(--ink);
  background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.brass{color:var(--brass)}
.good{color:var(--good)} .bad{color:var(--bad)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-stretch:112%;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(26px,3.4vw,38px);font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(3,8,23,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(26,49,104,.5)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 21px/1 var(--display);font-stretch:125%;letter-spacing:.06em}
.mark{width:32px;height:32px;border-radius:8px;background:var(--navy);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.mark svg{width:22px;height:22px}
.navlinks{display:flex;gap:4px;margin-left:12px}
.navlinks a{text-decoration:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:999px}
.navlinks a:hover{color:var(--fg)}
.navlinks a[aria-current="page"]{color:var(--fg);background:var(--deck)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;background:transparent;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn.sea{background:var(--sea);color:#04122e;box-shadow:0 0 32px rgba(79,168,255,.35)}
.btn.sea:hover{background:#6db7ff}
.btn.brass{background:var(--brass);color:#2a1b02}
.btn.brass:hover{background:#e8bd6c}
.btn.ghost{background:var(--deck);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--sea)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%;padding:15px;letter-spacing:.12em;text-transform:uppercase;font-size:14px}
.wallet-btn{font-family:var(--mono);font-size:13px}
.demo-tag{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--warn);border:1px dashed rgba(255,214,90,.45);padding:5px 8px;border-radius:6px;white-space:nowrap}

main{padding-bottom:140px}
.view{padding-block:28px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:6px;padding:7px;border-radius:18px;background:rgba(8,21,51,.92);border:1px solid var(--line);backdrop-filter:blur(10px)}
.dock a{width:58px;height:50px;border-radius:12px;display:grid;place-items:center;color:var(--muted);position:relative}
.dock a:hover{color:var(--fg)}
.dock a.plus{background:var(--deck);color:var(--fg)}
.dock a[aria-current="page"]{color:var(--fg)}
.dock a[aria-current="page"]::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--fg)}
.dock svg{width:22px;height:22px}

/* hero */
.hero{text-align:center;padding-block:64px 40px;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:10px;width:min(720px,90%);height:300px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(40,90,190,.45),transparent);pointer-events:none}
.word{position:relative;font-size:clamp(64px,13vw,168px);font-weight:900;font-stretch:125%;line-height:.9;letter-spacing:-.02em;display:inline-flex;align-items:center;justify-content:center}
.word .o{display:inline-grid;place-items:center;width:.84em;height:.84em;margin:0 .02em;border-radius:50%;background:var(--navy);box-shadow:0 0 0 .05em rgba(220,174,90,.85),0 0 60px rgba(79,168,255,.35);color:#fff;animation:bob 5s ease-in-out infinite}
.word .o svg{width:62%;height:62%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-.04em) rotate(3deg)}}
.tagline{position:relative;margin-top:30px;font:800 clamp(28px,4.4vw,48px)/1.12 var(--display);font-stretch:108%}
.sub{position:relative;margin:14px auto 0;color:var(--muted);max-width:560px;font-size:17px}
.hero-cta{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
.hero-cta .btn.sea{min-width:min(400px,100%);padding:17px;letter-spacing:.14em;text-transform:uppercase}
.ca{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;background:rgba(8,21,51,.6);max-width:100%;flex-wrap:wrap;justify-content:center}
.ca b{font:800 15px var(--display);font-stretch:110%;display:flex;align-items:center;gap:6px}
.ca b svg{width:16px;height:16px}
.ca .mono{color:var(--muted);font-size:13px}
.chip{border:0;background:var(--deck);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--fg)}

.statband{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.statband>div{background:var(--hull);padding:18px 20px}
.statband .k{font-size:13px;color:var(--muted)}
.statband .v{font:800 26px/1.2 var(--display);font-stretch:105%;margin-top:4px}

section.block{padding-block:56px 8px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sechead p{color:var(--muted);max-width:560px;margin-top:8px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;position:relative}
.step{background:var(--hull);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative}
.step .n{font:600 12px/1 var(--mono);color:var(--brass);letter-spacing:.08em}
.step h3{margin-top:12px;font-size:20px}
.step p{margin-top:8px;color:var(--muted);font-size:14px}
.step svg.ic{width:26px;height:26px;color:var(--sea);margin-top:16px}

/* fee split explainer */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.panel{background:var(--hull);border:1px solid var(--line);border-radius:18px;padding:24px}
.flow{display:flex;flex-direction:column;gap:14px}
.flowbar{display:flex;height:38px;border-radius:10px;overflow:hidden;font:600 12px/38px var(--mono)}
.flowbar>div{text-align:center;white-space:nowrap;overflow:hidden;color:#04122e}
.fb-r{background:var(--brass)} .fb-c{background:var(--sea)} .fb-p{background:#9fb4e8}
.legend{display:grid;gap:10px}
.legend .row{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.legend .row:last-child{border-bottom:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
label.fld{display:grid;gap:8px;font-weight:600;font-size:14px}
.input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 16px;outline:none}
.input:focus{border-color:var(--sea)}
.input::placeholder{color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--brass)}

/* compare */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--hull)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.yes{color:var(--good);font-weight:700}
.no{color:var(--faint)}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:rgba(14,33,80,.6)}

.flywheel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.flywheel svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.fw-node{fill:var(--hull);stroke:var(--line);stroke-width:1.5}
.fw-hub{fill:var(--navy);stroke:var(--brass);stroke-width:2}
.fw-t{fill:var(--fg);font:600 12.5px var(--body);text-anchor:middle}
.fw-s{fill:var(--muted);font:500 10.5px var(--body);text-anchor:middle}
.fw-arc{fill:none;stroke:var(--sea);stroke-width:2;stroke-dasharray:4 6;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.fw-head{fill:var(--sea)}
.notes{display:grid;gap:14px}
.note{border-left:2px solid var(--line);padding-left:16px}
.note b{display:block;margin-bottom:4px}
.note p{color:var(--muted);font-size:14px}

footer.foot{text-align:center;color:var(--faint);font-size:13px;padding-block:48px 0}
footer.foot a{color:var(--muted);text-decoration:none;margin:0 6px}
footer.foot p{max-width:620px;margin:12px auto 0}

/* explore */
.banner{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:linear-gradient(120deg,#0b2463,#132f78 55%,#1d3b8c);padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.banner h1{font-size:clamp(28px,3.6vw,42px);font-weight:900}
.banner p{color:#c3d0f0;margin-top:12px;max-width:470px}
.banner .btn{margin-top:22px}
.banner svg{width:100%;height:auto;display:block}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;align-items:center}
.search{flex:1 1 280px;position:relative}
.search .input{border-radius:999px;padding-left:44px;background:var(--hull)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.seg{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--hull);overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--deck);color:var(--fg)}
.seg .lbl{padding:0 6px 0 10px;color:var(--faint);font-size:13px;font-weight:600}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-top:22px}
.tabs button{border:0;background:none;padding:10px 0;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--sea)}
.tabs .count{font:500 12px var(--mono);color:var(--faint);margin-left:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.card{position:relative;overflow:hidden;display:block;text-decoration:none;background:var(--hull);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;transition:border-color .15s,transform .15s}
.card:hover{border-color:#2d4c99;transform:translateY(-2px)}
.card .ghostmark{position:absolute;right:-46px;top:-22px;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font:900 46px var(--display);font-stretch:110%;opacity:.22;pointer-events:none}
.card .top{display:flex;align-items:center;gap:10px;position:relative}
.card .t{font:700 13px var(--mono);letter-spacing:.04em;margin-top:14px;position:relative}
.card .mc{font:900 32px/1.1 var(--display);font-stretch:100%;position:relative;margin-top:2px}
.card .anch{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-top:6px;position:relative}
.card .anch b{color:var(--fg)}
.status{font:600 11px/1 var(--body);padding:5px 9px;border-radius:999px;margin-left:auto}
.status.grad{background:rgba(79,209,161,.14);color:var(--good)}
.status.bond{background:var(--sea-dim);color:var(--sea)}
.reserve-line{position:relative;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:8px}
.reserve-line .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.meter{height:6px;border-radius:999px;background:var(--deck);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--brass)}
.meter.sea i{background:var(--sea)}
.empty{padding:48px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;margin-top:20px}

.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:900 17px var(--display);color:#fff;overflow:hidden;background-size:cover;background-position:center}
.sb{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 8.5px/1 var(--mono);letter-spacing:-.02em}
.sb.lg{width:44px;height:44px;font-size:13px}
.sb svg{width:58%;height:58%;display:block}
.card .ghostmark svg{width:46%;height:46%}

/* launch */
.launch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;margin-top:24px}
.lstack{display:grid;gap:20px}
.lhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.lhead .n{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted)}
.lhead p{color:var(--muted);font-size:14px;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--sea-dim);border-color:var(--sea)}
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;max-height:340px;overflow-y:auto;padding-right:4px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.opt:hover{border-color:#2d4c99}
.opt[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-dim)}
.opt .sb{width:36px;height:36px;font-size:11px}
.opt b{font-weight:700}
.opt small{font:600 10px var(--body);letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin-left:6px}
.opt .nm{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .fee{display:block;color:var(--warn);font-size:11px;font-weight:600}
.opt .px{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.choices button{border:1px solid var(--line);background:var(--ink);border-radius:12px;padding:14px 10px;font-weight:700}
.choices button small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.choices button[aria-pressed="true"]{background:var(--sea);color:#04122e;border-color:var(--sea)}
.choices button[aria-pressed="true"] small{color:#0b2b5c}
.slidehead{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:8px}
.review{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.review .preview{display:flex;gap:14px;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.review .preview b{font:800 19px var(--display);font-stretch:108%;display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:9px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right}
.proj{margin-top:14px;padding:16px;border-radius:14px;background:var(--brass-dim);border:1px solid rgba(220,174,90,.35)}
.proj .big{font:900 28px/1.1 var(--display);color:var(--brass);margin-top:6px}
.hint{font-size:12px;color:var(--faint);margin-top:8px}
.upload{display:flex;align-items:center;gap:12px;background:var(--ink);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--muted)}
.upload:hover{border-color:var(--sea)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}

/* coin page */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.coinhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}
.coinhead .av{width:60px;height:60px;font-size:22px}
.coinhead h1{font-size:clamp(26px,3.4vw,36px);font-weight:900}
.coinhead .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:4px}
.coinhead .price{margin-left:auto;text-align:right}
.coinhead .price .v{font:900 30px var(--display)}
.coinlayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;margin-top:22px;align-items:start}
.chartbox svg{width:100%;height:auto;display:block}
.ax{fill:var(--faint);font:500 11px var(--mono)}
.gridl{stroke:var(--line);stroke-width:1}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:800 18px var(--display);margin-top:2px}
.reservecard{border-color:rgba(220,174,90,.4);background:linear-gradient(180deg,rgba(220,174,90,.08),transparent 60%),var(--hull)}
.gauge{display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.gauge svg{width:120px;height:120px;flex:none}
.g-bg{fill:none;stroke:var(--deck);stroke-width:12}
.g-fg{fill:none;stroke:var(--brass);stroke-width:12;stroke-linecap:round}
.g-t{fill:var(--fg);font:900 22px var(--display);text-anchor:middle}
.g-s{fill:var(--muted);font:500 10px var(--body);text-anchor:middle}
.vault{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:14px;min-width:0}
.vault .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tradebox .seg{width:100%}
.tradebox .seg button{flex:1}
.amount{position:relative;margin-top:14px}
.amount .input{font:600 22px var(--mono);padding-right:76px}
.amount span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:600 13px var(--mono);color:var(--muted)}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px;font:500 12px var(--mono);color:var(--muted)}
.out{background:var(--ink);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.log td{font-size:14px}
.side{display:grid;gap:20px}

/* analytics */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.tile{background:var(--hull);border:1px solid var(--line);border-radius:16px;padding:20px}
.tile .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font:900 32px/1.1 var(--display);margin-top:10px}
.tile .s{font-size:13px;color:var(--muted);margin-top:6px}
.tile.hl{border-color:rgba(220,174,90,.45)}
.tile.hl .v{color:var(--brass)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.mini{display:flex;justify-content:space-between;align-items:center;background:var(--hull);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--muted)}
.mini b{color:var(--fg);font:800 20px var(--display)}
.bars{display:grid;gap:12px;margin-top:8px}
.bar{display:grid;grid-template-columns:80px minmax(0,1fr) 84px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:24px;background:var(--ink);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:linear-gradient(90deg,rgba(220,174,90,.55),var(--brass));border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}

/* docs */
.doc{max-width:760px}
.doc h2{margin-top:44px;font-size:26px}
.doc p,.doc li{color:#c3cde6;margin-top:12px;max-width:66ch}
.doc ul{padding-left:20px}
.formula{font:500 14px/1.7 var(--mono);background:var(--hull);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px;overflow-x:auto;color:var(--fg)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--deck);border:1px solid var(--line);color:var(--fg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1000px){
  .steps{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .launch,.coinlayout{grid-template-columns:minmax(0,1fr)}
  .review{position:static}
  .tiles,.minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.flywheel,.two{grid-template-columns:minmax(0,1fr)}
  .navlinks{display:none}
}
@media (max-width:640px){
  .statband{grid-template-columns:1fr 1fr}
  .steps,.grid3{grid-template-columns:minmax(0,1fr)}
  .banner{grid-template-columns:minmax(0,1fr);padding:26px 22px}
  .picker,.row2,.row3{grid-template-columns:minmax(0,1fr)}
  .stats4{grid-template-columns:1fr 1fr}
  .top .pill.net,.top .demo-tag{display:none}
  .coinhead .price{margin-left:0;text-align:left;width:100%}
  .dock a{width:50px}
  .bar{grid-template-columns:64px minmax(0,1fr) 70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const COINS = [];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=v=>{const a=Math.abs(v);if(a>=1e6)return '$'+(v/1e6).toFixed(2)+'M';if(a>=1e3)return '$'+(v/1e3).toFixed(2)+'K';return '$'+v.toFixed(2)};
const usdFull=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tokPx=v=>'$'+(v<0.01?v.toPrecision(3):v.toFixed(4));
const nf=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>(v>=0?'+':'')+v.toFixed(d)+'%';
function rng(seed){let a=0;for(const ch of String(seed))a=(a*31+ch.charCodeAt(0))>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function addr(seed,n=44){const r=rng(seed);let s='';for(let i=0;i<n;i++)s+=B58[Math.floor(r()*58)];return s}
const short=a=>a.slice(0,5)+'…'+a.slice(-5);
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255}
/* [background, glyph] where the brand reads better than the default */
const GLYPH={AAPL:['#1d1d1f','#fff'],PLTR:['#101113','#fff'],NKE:['#111111','#fff'],SPCX:['#0b0d12','#fff'],ANTHROPIC:['#d4a27f','#191919'],GOOGL:['#ffffff','#4285f4'],MCD:['#da291c','#ffc72c'],AMZN:['#ff9900','#111111'],HOOD:['#ccff00','#111111'],MSTR:['#f7931a','#ffffff'],OPENAI:['#10a37f','#ffffff'],MSFT:['#ffffff','#111111']};
const MSFT_SVG='<svg viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" fill="#f25022"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#7fba00"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#00a4ef"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#ffb900"/></svg>';
function mark(sym){const s=STK[sym];const [bg,fg]=GLYPH[sym]||[s.color,lum(s.color)>0.6?'#0a1430':'#fff'];
  const inner=LOGOS[sym]?`<svg viewBox="0 0 24 24" fill="${fg}"><path d="${LOGOS[sym]}"/></svg>`:sym==='MSFT'?MSFT_SVG:(sym.length>4?sym.slice(0,2):sym.slice(0,4));
  return {bg,fg,inner}}
function badge(sym,cls=''){const m=mark(sym);return `<span class="sb ${cls}" style="background:${m.bg};color:${m.fg}" title="${STK[sym].name}" aria-hidden="true">${m.inner}</span>`}
function avatar(c,size=''){if(c.img)return `<span class="av" style="background-image:url(${c.img});${size}" aria-hidden="true"></span>`;return `<span class="av" style="background:linear-gradient(135deg,hsl(${c.hue} 70% 55%),hsl(${(c.hue+40)%360} 65% 32%));${size}" aria-hidden="true">${esc((c.t||'?')[0])}</span>`}

function derive(c){
  const s=STK[c.a];
  c.stock=s;
  c.price=c.mcap/SUPPLY;
  c.reserve=c.sh*s.price;
  c.backing=c.reserve/c.mcap;
  c.floor=c.reserve*c.red/100/SUPPLY;
  c.graduated=c.mcap>=GRAD_MCAP;
  c.prog=Math.min(100,Math.max(0,(c.mcap-LAUNCH_MCAP)/(GRAD_MCAP-LAUNCH_MCAP)*100));
  c.fees=c.reserve/(c.split[0]/100);
  c.creatorFees=c.fees*c.split[1]/100;
  c.buyback=c.fees*c.split[2]/100;
  c.vault=addr('vault'+c.id);
  c.mint=addr('mint'+c.id);
  return c;
}
COINS.forEach(derive);

const TOT={
  reserve:COINS.reduce((a,c)=>a+c.reserve,0),
  fees:COINS.reduce((a,c)=>a+c.fees,0),
  creators:COINS.reduce((a,c)=>a+c.creatorFees,0),
  buyback:COINS.reduce((a,c)=>a+c.buyback,0),
  grads:COINS.filter(c=>c.graduated).length,
  stocks:new Set(COINS.map(c=>c.a)).size,
  burned:0,
};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function copy(text){try{navigator.clipboard.writeText(text).then(()=>toast('Copied'),()=>toast(text))}catch(e){toast(text)}}

/* ---------- charts ---------- */
function series(seed,n,end,vol,drift=0){const r=rng(seed);let v=1;const out=[];for(let i=0;i<n;i++){v*=1+(r()-0.5)*vol+drift;out.push(v)}const k=end/out[n-1];return out.map(x=>x*k)}
function areaChart(pts,{w=640,h=240,color='var(--sea)',fmt=usd,labels=[],id='c'}={}){
  const P={l:62,r:14,t:14,b:26};
  const mn=Math.min(...pts),mx=Math.max(...pts);const sp=(mx-mn)||mx||1;
  const lo=Math.max(0,mn-sp*.1),hi=mx+sp*.1;
  const X=i=>P.l+i*(w-P.l-P.r)/(pts.length-1);
  const Y=v=>P.t+(hi-v)/(hi-lo)*(h-P.t-P.b);
  let g='';for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3;const y=Y(v);g+=`<line class="gridl" x1="${P.l}" x2="${w-P.r}" y1="${y}" y2="${y}"/><text class="ax" x="${P.l-8}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  labels.forEach(([i,t])=>{g+=`<text class="ax" x="${X(i)}" y="${h-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${t}</text>`});
  const line=pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const area=line+`L${X(pts.length-1)} ${h-P.b}L${P.l} ${h-P.b}Z`;
  const ex=X(pts.length-1),ey=Y(pts[pts.length-1]);
  return `<svg viewBox="0 0 ${w} ${h}" role="img"><defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#g${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${ex}" cy="${ey}" r="4.5" fill="${color}"/><circle cx="${ex}" cy="${ey}" r="9" fill="${color}" opacity=".2"/></svg>`
}

    <span class="ghostmark" style="background:${m.bg};color:${m.fg}">${m.inner}</span>

    <div class="mc num">${usd(c.mcap)}</div>

      ${c.graduated?'':`<div class="meter sea" title="Bonding curve progress"><i style="width:${c.prog}%"></i></div>`}
    </div>
  </a>`
}

function flywheelSVG(){
  const nodes=[['More coins','launch on ANCHOR'],['More trading','across every coin'],['More fees','25% to protocol'],['Buy & burn','$ANCHOR supply shrinks'],['More creators','drawn to the ecosystem']];
  const cx=220,cy=220,R=150;let s='';
  const pos=nodes.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[cx+R*Math.cos(a),cy+R*Math.sin(a),a]});
  pos.forEach(([x,y,a],i)=>{const a1=a+0.36,a2=a+2*Math.PI/5-0.36;const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    s+=`<path class="fw-arc" d="M${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}"/>`;
    const ta=a2+Math.PI/2;const hx=x2,hy=y2;
    s+=`<path class="fw-head" d="M${hx+7*Math.cos(ta)} ${hy+7*Math.sin(ta)}L${hx+5*Math.cos(ta+2.2)} ${hy+5*Math.sin(ta+2.2)}L${hx+5*Math.cos(ta-2.2)} ${hy+5*Math.sin(ta-2.2)}Z"/>`});
  pos.forEach(([x,y],i)=>{s+=`<g><rect class="fw-node" x="${x-62}" y="${y-26}" width="124" height="52" rx="12"/><text class="fw-t" x="${x}" y="${y-3}">${nodes[i][0]}</text><text class="fw-s" x="${x}" y="${y+13}">${nodes[i][1]}</text></g>`});
  s+=`<circle class="fw-hub" cx="${cx}" cy="${cy}" r="46"/><svg x="${cx-26}" y="${cy-26}" width="52" height="52" style="color:#fff"><use href="#anchor"/></svg>`;
  return `<svg viewBox="0 0 440 440" role="img" aria-label="Flywheel: more coins, more trading, more fees, buy and burn $ANCHOR, more creators">${s}</svg>`
}

      <div class="panel">
        <h3>Fee split</h3>
        <div class="flowbar" style="margin-top:12px" aria-hidden="true"><div class="fb-r" style="width:${c.split[0]}%">${c.split[0]}%</div><div class="fb-c" style="width:${c.split[1]}%">${c.split[1]}%</div><div class="fb-p" style="width:${c.split[2]}%">${c.split[2]}%</div></div>
        <div class="kv" style="margin-top:8px"><span><i class="sw fb-r"></i>Reserve</span><span class="num">${usd(c.fees*c.split[0]/100)}</span></div>
        <div class="kv"><span><i class="sw fb-c"></i>Creator</span><span class="num">${usd(c.creatorFees)}</span></div>
        <div class="kv"><span><i class="sw fb-p"></i>$ANCHOR buyback</span><span class="num">${usd(c.buyback)}</span></div>
        <div class="vault"><span class="muted">Mint</span><span class="mono">${c.mint}</span><button class="chip" data-copy="${c.mint}" aria-label="Copy mint address"><svg width="14" height="14"><use href="#i-copy"/></svg></button></div>
      </div>
    </div>
  </div></div>`
}
function gauge(b){
  const r=48,C=2*Math.PI*r,frac=Math.min(1,b*4);
  return `<svg viewBox="0 0 120 120" role="img" aria-label="Backing ratio ${(b*100).toFixed(1)} percent"><circle class="g-bg" cx="60" cy="60" r="${r}"/><circle class="g-fg" cx="60" cy="60" r="${r}" stroke-dasharray="${C*frac} ${C}" transform="rotate(-90 60 60)"/><text class="g-t" x="60" y="62">${(b*100).toFixed(1)}%</text><text class="g-s" x="60" y="78">backed</text></svg>`
}
let side='buy';
function updateTrade(c){
  const v=parseFloat($('#tAmt').value)||0;const f=0.01;
  if(side==='buy'){const usdIn=v*SOL_USD;const fee=usdIn*f;const out=(usdIn-fee)/c.price;
    $('#tOut').innerHTML=`<div class="kv" style="padding-block:4px"><span>You receive ≈</span><span class="num">${nf(out)} $${c.t}</span></div><div class="kv" style="padding-block:4px"><span>Fee</span><span class="num">${usdFull(fee)}</span></div><div class="kv" style="padding-block:4px"><span>Adds to reserve</span><span class="num brass">${(fee*c.split[0]/100/c.stock.price).toFixed(5)} ${c.a}x</span></div>`}
  else{const usdOut=v*c.price;const fee=usdOut*f;
    $('#tOut').innerHTML=`<div class="kv" style="padding-block:4px"><span>You receive ≈</span><span class="num">${((usdOut-fee)/SOL_USD).toFixed(4)} SOL</span></div><div class="kv" style="padding-block:4px"><span>Fee</span><span class="num">${usdFull(fee)}</span></div><div class="kv" style="padding-block:4px"><span>Adds to reserve</span><span class="num brass">${(fee*c.split[0]/100/c.stock.price).toFixed(5)} ${c.a}x</span></div>`}
}
function updateRedeem(c){
  const n=Math.max(0,parseFloat($('#rAmt').value)||0);
  const sh=n/SUPPLY*c.sh*c.red/100;const val=sh*c.stock.price;const mkt=n*c.price;
  $('#rOut').innerHTML=`<div class="kv" style="padding-block:4px"><span>You receive</span><span class="num brass">${sh.toFixed(6)} ${c.a}x</span></div><div class="kv" style="padding-block:4px"><span>Worth</span><span class="num">${usdFull(val)}</span></div><div class="kv" style="padding-block:4px"><span>Selling instead</span><span class="num">${usdFull(mkt)}</span></div><p class="hint" style="margin-top:6px">${mkt>val?'Selling pays more right now. Redemption is the floor if price falls below the reserve.':'Redemption pays more than selling right now.'}</p>`
}

/* ---------- analytics ---------- */
function vAnalytics(){
  const byStock={};COINS.forEach(c=>{byStock[c.a]=(byStock[c.a]||0)+c.reserve});
  const rows=Object.entries(byStock).sort((a,b)=>b[1]-a[1]).slice(0,8);const max=rows.length?rows[0][1]:1;
  const mcapSum=COINS.reduce((a,c)=>a+c.mcap,0);
  const none=t=>`<div class="empty" style="margin-top:16px;padding:32px">${t}</div>`;
  return `<div class="wrap">
  <h1 style="font-size:clamp(28px,4vw,42px);font-weight:900">Reserves</h1>
  <p class="muted" style="margin-top:8px;max-width:720px">Every reserve is a program-owned vault on Solana. Share counts are read from the vaults; dollar values use today's stock prices.</p>
  <div class="tiles">
    <div class="tile hl"><div class="k">Stock in reserves</div><div class="v num">${usd(TOT.reserve)}</div><div class="s">Across ${COINS.length} coin vaults</div></div>
    <div class="tile"><div class="k">Earned by creators</div><div class="v num">${usd(TOT.creators)}</div><div class="s">Paid to each coin's fee receiver</div></div>
    <div class="tile"><div class="k">$ANCHOR buybacks</div><div class="v num">${usd(TOT.buyback)}</div><div class="s">${nf(TOT.burned)} burned (${(TOT.burned/1e7).toFixed(2)}% of supply)</div></div>
    <div class="tile"><div class="k">Avg backing</div><div class="v num">${mcapSum?(TOT.reserve/mcapSum*100).toFixed(1)+'%':'—'}</div><div class="s">Reserve value ÷ market cap</div></div>
  </div>
  <div class="minis">
    <div class="mini">Total fees<b class="num">${usd(TOT.fees)}</b></div>
    <div class="mini">Coins launched<b class="num">${COINS.length}</b></div>
    <div class="mini">Graduated<b class="num">${TOT.grads}</b></div>
    <div class="mini">Stocks in use<b class="num">${TOT.stocks}</b></div>
  </div>
  <div class="two">
    <div class="panel"><h3>Reserve value by stock</h3><p class="muted" style="font-size:14px;margin-top:4px">Top ${rows.length}, summed across coins</p>
      ${rows.length?'':none('Reserves appear here once the first coin trades.')}
      <div class="bars" style="margin-top:16px">${rows.map(([sym,v])=>`<div class="bar"><span style="display:flex;gap:8px;align-items:center">${badge(sym)}<b style="font-size:13px">${sym.length>5?sym.slice(0,5):sym}</b></span><span class="track"><i style="width:${v/max*100}%"></i></span><span class="num" style="text-align:right">${usd(v)}</span></div>`).join('')}</div>
    </div>
    <div class="panel chartbox"><h3>$ANCHOR burned</h3><p class="muted" style="font-size:14px;margin-top:4px">Cumulative, last 30 days</p>
      ${none('Buybacks start with the first fees earned.')}</div>
  </div>
  <section class="block" style="padding-top:36px">
    <div class="sechead"><div><span class="eyebrow">Vaults</span><h2 style="margin-top:10px;font-size:26px">Every coin's reserve</h2></div></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Coin</th><th>Stock</th><th class="r">Shares held</th><th class="r">Reserve</th><th class="r">Backing</th><th class="r">Floor / token</th><th>Vault</th></tr></thead>
      <tbody>${[...COINS].sort((a,b)=>b.reserve-a.reserve).map(c=>`<tr class="link" data-go="coin-${c.id}"><td><b>$${c.t}</b></td><td><span style="display:inline-flex;gap:6px;align-items:center">${badge(c.a)}${c.a}</span></td><td class="r brass">${nf(c.sh,2)}</td><td class="r">${usd(c.reserve)}</td><td class="r">${(c.backing*100).toFixed(1)}%</td><td class="r">${tokPx(c.floor)}</td><td class="mono muted" style="font-size:12px">${short(c.vault)}</td></tr>`).join('')||`<tr><td colspan="7" class="muted" style="text-align:center;padding:32px">No vaults yet. Each coin gets one at launch.</td></tr>`}</tbody>
    </table></div>
  </section></div>`
}

/* ---------- profile ---------- */
function vProfile(){
  if(!S.wallet||!COINS.length)return `<div class="wrap" style="max-width:920px"><h1 style="font-size:clamp(28px,4vw,42px);font-weight:900">Profile</h1>
    <div class="panel" style="text-align:center;margin-top:20px;padding:40px 24px"><p class="muted">Connect a wallet to see your coins, the stock your holdings can redeem, and the fees your launches earn.</p><button class="btn sea" style="margin-top:18px" data-act="wallet">Connect wallet</button></div></div>`;
  const hold=[[COINS[0],4200000],[COINS[3],12500000],[COINS[6],8000000]];
  const mine=COINS[6];
  return `<div class="wrap" style="max-width:920px">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><h1 style="font-size:clamp(28px,4vw,42px);font-weight:900">Profile</h1><span class="pill mono" style="font-size:13px">${short(S.wallet)}</span></div>
    <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="tile"><div class="k">Holdings value</div><div class="v num">${usd(hold.reduce((a,[c,n])=>a+n*c.price,0))}</div></div>
      <div class="tile hl"><div class="k">Redeemable stock</div><div class="v num">${usd(hold.reduce((a,[c,n])=>a+n/SUPPLY*c.reserve*c.red/100,0))}</div></div>
      <div class="tile"><div class="k">Creator fees earned</div><div class="v num">${usd(mine.creatorFees)}</div></div>
    </div>
    <h3 style="margin-top:28px">Holdings</h3>
    <div class="tablewrap" style="margin-top:12px"><table>
      <thead><tr><th>Coin</th><th class="r">Balance</th><th class="r">Value</th><th class="r">Your reserve claim</th></tr></thead>
      <tbody>${hold.map(([c,n])=>{const sh=n/SUPPLY*c.sh*c.red/100;return `<tr class="link" data-go="coin-${c.id}"><td><b>$${c.t}</b> <span class="muted">→ ${c.a}</span></td><td class="r">${nf(n)}</td><td class="r">${usd(n*c.price)}</td><td class="r brass">${sh.toFixed(5)} ${c.a}x</td></tr>`}).join('')}</tbody>
    </table></div>
    <h3 style="margin-top:28px">Coins you launched</h3>
    <div class="grid3" style="grid-template-columns:minmax(0,1fr)">${cardHTML(mine)}</div>
    <button class="btn ghost" style="margin-top:20px" data-act="disconnect">Disconnect wallet</button>
  </div>`
}

/* ---------- docs ---------- */
function vDocs(){
  return `<div class="wrap"><div class="doc">
  <span class="eyebrow">Docs</span>
  <h1 style="font-size:clamp(30px,4.4vw,46px);font-weight:900;margin-top:10px">How ANCHOR works</h1>
  <p>ANCHOR is a Solana launchpad where every coin is tied to one tokenized stock. A share of each trade's fee buys that stock and holds it in a vault the coin's holders can redeem against.</p>
  <h2>Launch</h2>
  <p>Creators pick a reserve stock, name the coin, choose the trading fee (1, 2 or 3%), the reserve's share of that fee (25 to 75%), and the redemption rules. Supply is fixed at 1,000,000,000. Coins start near ${usd(LAUNCH_MCAP)} market cap on a bonding curve and graduate to a Raydium pool at ${usd(GRAD_MCAP)}, with LP tokens burned.</p>
  <h2>Fee routing</h2>
  <p>Each trade's fee is split in the same instruction as the trade:</p>
  <ul><li><b>Reserve</b>: swapped into the chosen stock token and deposited to the coin's vault.</li><li><b>Creator</b>: sent to the fee receiver set at launch.</li><li><b>Protocol (fixed 25%)</b>: buys $ANCHOR on the open market and burns it.</li></ul>
  <h2>Backing ratio</h2>
  <div class="formula">backing = (shares in vault × stock price) ÷ market cap</div>
  <p>This is a live measurement, not a peg. A coin with 5% backing still trades on demand; the reserve is what holders could claim, not what the market must pay.</p>
  <h2>Redemption</h2>
  <div class="formula">claim (shares) = tokens burned ÷ circulating supply × vault shares × redeemable %</div>
  <p>Redeemed coins are burned, which shrinks supply as the vault shrinks, so each remaining coin's claim stays the same. The non-redeemable part of the vault never leaves, which keeps a permanent floor under the backing.</p>
  <h2>Risks and limits</h2>
  <ul>
    <li>Tokenized stocks are issued by third parties (xStocks, Sunrise, PreStock) with their own custody, eligibility and transfer rules. Some charge transfer fees.</li>
    <li>Reserve value moves with the stock. A falling stock lowers every coin's backing.</li>
    <li>Buybacks depend on fees actually earned. They do not guarantee that $ANCHOR or any coin rises in price.</li>
    <li>Using tokenized equities this way may be restricted in some jurisdictions. ANCHOR geofences where required.</li>
  </ul>
  </div></div>`
}

/* ---------- router ---------- */
let current='';
function route(){
  let h=(location.hash||'#home').slice(1)||'home';
  const v=$('#view');
  const base=h.startsWith('coin-')?'coin':h;
  const views={home:vHome,explore:vExplore,launch:vLaunch,analytics:vAnalytics,profile:vProfile,docs:vDocs};
  if(base==='coin')v.innerHTML=`<div class="view">${vCoin(h.slice(5))}</div>`;
  else v.innerHTML=`<div class="view">${(views[h]||vHome)()}</div>`;
  document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===(base==='coin'?'explore':(views[h]?h:'home'));on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  if(h!==current)window.scrollTo(0,0);current=h;
  if(base==='home')updateExample();
  if(h==='explore')renderGrid();
  if(h==='launch'){renderPicker();renderReview()}
  if(base==='coin'){const c=COINS.find(x=>x.id===h.slice(5));if(c){side='buy';updateTrade(c);updateRedeem(c)}}
  $('#walletBtn').textContent=S.wallet?short(S.wallet):'Connect wallet';
}
function updateExample(){
  const el=$('#exOut');if(!el)return;const v=Math.max(0,parseFloat($('#exAmt').value)||0);const fee=v*.01;const nv={stock:STK.NVDA};
  el.innerHTML=`<div class="row"><span><i class="sw fb-r"></i>Buys NVDA for the reserve</span><span class="num"><b>${usdFull(fee*.5)}</b> <span class="brass">= ${(fee*.5/nv.stock.price).toFixed(5)} NVDAx</span></span></div>
  <div class="row"><span><i class="sw fb-c"></i>Creator fee</span><span class="num"><b>${usdFull(fee*.25)}</b></span></div>
  <div class="row"><span><i class="sw fb-p"></i>$ANCHOR buyback &amp; burn</span><span class="num"><b>${usdFull(fee*.25)}</b></span></div>`
}
const curCoin=()=>COINS.find(x=>'coin-'+x.id===current);

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;
  const d=t.dataset;
  if(d.go){location.hash=d.go;return}
  if(d.copy){copy(d.copy);return}
  if(d.sort){S.sort=d.sort;document.querySelectorAll('[data-sort]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderGrid();return}
  if(d.tab){S.tab=d.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderGrid();return}
  if(d.lf){S.L.filter=d.lf;document.querySelectorAll('[data-lf]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderPicker();return}
  if(d.stock){S.L.stock=d.stock;document.querySelectorAll('[data-stock]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderReview();return}
  if(d.fee){S.L.fee=+d.fee;document.querySelectorAll('[data-fee]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderReview();return}
  if(d.red){S.L.red=+d.red;document.querySelectorAll('[data-red]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderReview();return}
  if(d.when){S.L.redWhen=d.when;document.querySelectorAll('[data-when]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderReview();return}
  if(d.chart){const box=$('#chartArea');document.querySelectorAll('[data-chart]').forEach(b=>b.setAttribute('aria-pressed',b===t));
    t.closest('.chartbox').querySelector('h3').textContent=d.chart==='price'?'Price':'Reserve value';
    const lbl=[[0,'7d ago'],[36,'3.5d'],[71,'now']];
    box.innerHTML=d.chart==='price'?areaChart(JSON.parse(box.dataset.price),{fmt:v=>tokPx(v),labels:lbl,id:'p'}):areaChart(JSON.parse(box.dataset.res),{color:'var(--brass)',fmt:usd,labels:lbl,id:'r'});return}
  if(d.side){side=d.side;document.querySelectorAll('[data-side]').forEach(b=>b.setAttribute('aria-pressed',b===t));const c=curCoin();
    $('#tUnit').textContent=side==='buy'?'SOL':'$'+c.t.slice(0,6);$('#tAmt').value=side==='buy'?1:1000000;$('#tAmt').step=side==='buy'?0.1:100000;
    $('#tQuick').innerHTML=(side==='buy'?['0.1','0.5','1','5']:['250K','1M','5M','10M']).map(v=>`<button data-q="${v}">${v}</button>`).join('');
    document.querySelector('[data-act="trade"]').textContent=(side==='buy'?'Buy':'Sell')+' $'+c.t;updateTrade(c);return}
  if(d.q){const v=d.q.endsWith('K')?parseFloat(d.q)*1e3:d.q.endsWith('M')?parseFloat(d.q)*1e6:parseFloat(d.q);$('#tAmt').value=v;updateTrade(curCoin());return}
  const act=d.act;
  if(act==='wallet'){toast('Wallet connections open at launch.');return}
  if(act==='disconnect'){S.wallet=null;route();return}
  if(act==='launch'){
    if(!S.L.ticker.trim()){toast('Add a ticker before launching');$('#lt').focus();return}
    toast('Launching opens with wallet connections at launch.');return}
  if(act==='trade'){toast('Trading opens at launch.');return}
  if(act==='redeem'){toast('Redemptions open at launch.');return}
});
document.addEventListener('input',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='q'){S.q=v;renderGrid()}
  else if(id==='exAmt')updateExample();
  else if(id==='lq'){S.L.q=v;renderPicker()}
  else if(id==='lt'){e.target.value=v.toUpperCase().replace(/[^A-Z0-9]/g,'');S.L.ticker=e.target.value;renderReview()}
  else if(id==='ln'){S.L.name=v;renderReview()}
  else if(id==='ld'){S.L.desc=v}
  else if(id==='lres'){S.L.reserve=+v;renderReview()}
  else if(id==='lvol'){S.L.vol=+v;$('#lvolV').textContent=usd(S.L.vol)+'/day';$('#projOut').innerHTML=projHTML()}
  else if(id==='tAmt')updateTrade(curCoin());
  else if(id==='rAmt')updateRedeem(curCoin());
});
document.addEventListener('change',e=>{
  if(e.target.id==='limg'&&e.target.files[0]){const f=e.target.files[0];const r=new FileReader();r.onload=()=>{S.L.img=r.result;const p=$('#limgPrev');p.style.backgroundImage=`url(${r.result})`;p.textContent='';$('#limgName').textContent=f.name;renderReview()};r.readAsDataURL(f)}
});
window.addEventListener('hashchange',route);
route();
</script>

</body>
</html>
